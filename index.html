<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>טוען מאמן מורן…</title><style>body{font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#eef3f1;color:#176b55}main{text-align:center}div{width:42px;height:42px;border:5px solid #dcefe9;border-top-color:#176b55;border-radius:50%;animation:s 1s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><main><div></div><p>טוען את המאמן…</p></main><script>(async()=>{try{const n=10;const a=await Promise.all(Array.from({length:n},(_,i)=>fetch(`part-${String(i).padStart(2,'0')}.txt?v=2.0.0`).then(r=>{if(!r.ok)throw Error(r.status);return r.text()})));document.open();document.write(a.join(''));document.close()}catch(e){document.body.innerHTML='<main><h1>שגיאה בטעינה</h1><p>רענן את הדף ונסה שוב.</p></main>';console.error(e)}})();</script></body></html>
